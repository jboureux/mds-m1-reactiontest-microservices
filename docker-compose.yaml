services:
  api-gateway:
    build:
      context: .
      dockerfile: docker/DEV.Dockerfile
    volumes:
      - ./:/app/
    ports:
      - "8000:8000"
    networks:
      - microservices

  auth:
    build:
      context: .
      dockerfile: docker/DEV.Dockerfile
    volumes:
      - ./:/app/
    ports:
      - "8001:8001"
    networks:
      - microservices

  user:
    build:
      context: .
      dockerfile: docker/DEV.Dockerfile
    volumes:
      - ./:/app/
    ports:
      - "8002:8002"
    networks:
      - microservices
  
  timer:
    build:
      context: .
      dockerfile: docker/DEV.Dockerfile
    volumes:
      - ./:/app/
    ports:
      - "8003:8003"
    networks:
      - microservices

  frontend:
    build:
      context: .
      dockerfile: docker/DEV.Dockerfile  # adjust if your Dockerfile is named differently
    volumes:
      - ./services/frontend/reaction_timer:/app
    ports:
      - "3000:3000"  # expose the Next.js app on port 3000
    networks:
      - microservices

  user-database:
    image: mongo:latest
    ports:
      - "27217:27017"
    networks:
      - microservices


networks:
  microservices:
    driver: bridge
